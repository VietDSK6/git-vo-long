<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <title>Tăng số</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="container">
    <span id="number">0</span>
    <br>
    <button onclick="increaseNumber()">+1</button>
    <button onclick="decreaseNumber()">-1</button>
    <button onclick="increaseBy(5)">+5</button>
    <button onclick="increaseBy(10)">+10</button>
    <button onclick="resetNumber()">Reset</button>
    <button onclick="toggleDarkMode()">Dark/Light</button>
    <button onclick="autoIncrease()">Auto Start</button>
    <button onclick="stopAuto()">Auto Stop</button>
    
    <p>Giới hạn tối đa: <b>100</b></p>
    <p>Giờ hiện tại: <span id="clock"></span></p>

    <!-- chỗ để hiển thị câu slogan -->
    <p id="slogan" style="font-weight: bold; margin-top: 15px;"></p>
  </div>

  <script>
    let count = 0;
    let autoInterval = null;

    if(localStorage.getItem("count")){
      count = parseInt(localStorage.getItem("count"));
      updateDisplay();
    }

    function updateDisplay() {
      let displayText = count;
      let sloganText = "";

      if (count === 36) {
        displayText = "Thanh Hóa";
        sloganText = "Ăn rau má phá đường tàu";
      } else if (count === 18) {
        displayText = "Nam Định";
        sloganText = "12 cái ví mất cùng 1 đêm";
      }

      document.getElementById("number").textContent = displayText;
      document.getElementById("slogan").textContent = sloganText;

      localStorage.setItem("count", count);
    }

    function increaseNumber() {
      if (count < 100) {
        count++;
        updateDisplay();
        playClick();
        randomColor();
      }
    }

    function decreaseNumber() {
      if (count > 0) {
        count--;
        updateDisplay();
        playClick();
        randomColor();
      }
    }

    function increaseBy(n) {
      count += n;       
      updateDisplay();    
      playClick();        
      randomColor();       
    }

    function resetNumber() {
      if(confirm("Bạn có chắc muốn reset về 0?")){
        count = 0;
        updateDisplay();
        playClick();
      }
    }

    function toggleDarkMode() {
      document.body.classList.toggle("dark");
    }

    function autoIncrease() {
      if (!autoInterval) {
        autoInterval = setInterval(increaseNumber, 1000);
      }
    }

    function stopAuto() {
      clearInterval(autoInterval);
      autoInterval = null;
    }

    function randomColor() {
      let randomColor = "#" + Math.floor(Math.random() * 16777215).toString(16).padStart(6, "0");
      document.getElementById("number").style.color = randomColor;
    }

    function playClick() {
      let audio = new Audio("https://www.soundjay.com/buttons/sounds/button-16.mp3");
      audio.play();
    }

    function updateClock(){
      let now = new Date();
      document.getElementById("clock").textContent = now.toLocaleTimeString();
    }
    setInterval(updateClock, 1000);
    updateClock();
  </script>

</body>
</html>
